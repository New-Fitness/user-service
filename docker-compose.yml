version: '3.8'
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: user_service_local
      POSTGRES_USER: local_user
      POSTGRES_PASSWORD: local_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U local_user -d user_service_local"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: